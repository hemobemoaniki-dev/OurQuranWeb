name: Web desktop check

on:
  push:
    branches:
      - "web/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci --include=dev

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Export web app
        run: npx expo export --platform web
