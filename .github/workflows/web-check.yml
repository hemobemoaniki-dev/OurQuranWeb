name: Web desktop check

on:
  push:
    branches:
      - main
      - "web/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci --include=dev

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Regression checks
        run: node ./scripts/prelaunch-check.cjs

      - name: Generate production SEO assets
        env:
          CF_PAGES_BRANCH: main
          SITE_URL: https://ourquran.pages.dev
        run: node ./scripts/generate-seo-files.mjs

      - name: Export web app
        run: npx expo export --platform web
